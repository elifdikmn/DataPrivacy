name: deploy-backend-hf

# Pushes the backend (Dockerfile + backend/) to a Hugging Face Docker Space,
# which then builds the image and restarts the API.
# Setup (GitHub repo → Settings → Secrets and variables → Actions):
#   secret   HF_TOKEN  — Hugging Face access token with write permission
#   variable HF_SPACE  — Space id, e.g. elifdikmn/dataprivacy-api
# The workflow is skipped until HF_SPACE is set.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/huggingface/**"
      - ".github/workflows/deploy-backend-hf.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend-hf
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.HF_SPACE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install "huggingface_hub>=1.0,<3"

      - name: Assemble the Space contents
        run: |
          mkdir -p space/backend
          cp Dockerfile .dockerignore space/
          cp deploy/huggingface/README.md space/README.md
          cp -r backend/requirements.txt backend/app backend/data backend/knowledge \
                backend/final_results backend/static space/backend/
          # Never ship local secrets or generated indices (the image builds its own).
          rm -rf space/backend/app/index_store space/backend/.env

      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["HF_SPACE"]
          api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(
              repo_id=space,
              repo_type="space",
              folder_path="space",
              commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]} from GitHub",
              delete_patterns=["backend/**"],  # remove files deleted on GitHub
          )
          owner, name = space.split("/")
          print(f"Deployed. API URL: https://{owner}-{name}.hf.space".lower().replace("_", "-"))
          PY
